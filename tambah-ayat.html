<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Ayat - Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8fafc; color: #334155; padding: 20px; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
    .card { background: white; padding: 28px; border-radius: 16px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-b: 2px solid #f1f5f9; padding-bottom: 10px; }
    .header h2 { font-size: 18px; color: #1e293b; }
    .back-btn { text-decoration: none; color: #64748b; font-size: 14px; font-weight: 600; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 6px; }
    .form-group input, .form-group textarea { width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
    .form-group textarea { height: 100px; resize: vertical; }
    .btn { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 14px; }
    .btn:hover { background-color: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h2>📖 Input Ayat Alkitab</h2>
      <a href="dashboard.html" class="back-btn">← Kembali</a>
    </div>
    <form id="form-ayat">
      <div class="form-group">
        <label>Kitab & Pasal</label>
        <input type="text" id="kitab" placeholder="Contoh: Yeremia 29:11" required>
      </div>
      <div class="form-group">
        <label>Isi Ayat</label>
        <textarea id="isi" placeholder="Tuliskan firman Tuhan..." required></textarea>
      </div>
      <button type="submit" class="btn">Simpan Ayat</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyDB0E9H12BK6TaYdewtQc-gPhuFaf_HZ9c", databaseURL: "https://kas-pemuda-gereja-default-rtdb.firebaseio.com", projectId: "kas-pemuda-gereja" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById('form-ayat').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await push(ref(db, 'ayat'), {
          kitab: document.getElementById('kitab').value,
          isi: document.getElementById('isi').value
        });
        alert("Ayat Alkitab berhasil disimpan!");
        window.location.href = "ayat.html";
      } catch (err) { alert("Gagal: " + err.message); }
    });
  </script>
</body>
</html>
