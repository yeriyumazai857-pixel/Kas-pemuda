<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Ayat - Pemuda/i BNKP Samosir</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8fafc; color: #334155; padding: 20px; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
    .card { background: white; padding: 28px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
    .header h2 { font-size: 18px; color: #1e293b; }
    .back-btn { text-decoration: none; color: #64748b; font-size: 14px; font-weight: 600; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 6px; }
    .form-group input, .form-group textarea { width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background-color: #fff; }
    .form-group input:focus, .form-group textarea:focus { border-color: #2563eb; }
    .form-group textarea { height: 110px; resize: vertical; }
    .btn { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 14px; }
    .btn:hover { background-color: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h2>📖 Input Ayat Alkitab</h2>
      <a href="dashboard.html" class="back-btn">← Kembali</a>
    </div>
    <form id="form-ayat">
      <div class="form-group">
        <label>Nama Pengirim</label>
        <input type="text" id="penginput" placeholder="Nama Anda..." required>
      </div>
      <div class="form-group">
        <label>Judul Ayat / Renungan</label>
        <input type="text" id="judul" placeholder="Contoh: Harapan Masa Depan" required>
      </div>
      <div class="form-group">
        <label>Kitab & Pasal (Referensi)</label>
        <input type="text" id="referensi" placeholder="Contoh: Yeremia 29:11" required>
      </div>
      <div class="form-group">
        <label>Isi atau Makna Ayat</label>
        <textarea id="isi" placeholder="Tuliskan isi firman Tuhan atau maknanya..." required></textarea>
      </div>
      <button type="submit" class="btn">Simpan Ayat</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, get, child, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyDB0E9H12BK6TaYdewtQc-gPhuFaf_HZ9c", databaseURL: "https://kas-pemuda-gereja-default-rtdb.firebaseio.com", projectId: "kas-pemuda-gereja" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Cek status login dan ambil nama user secara otomatis untuk mengisi form pengirim
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
      } else {
        try {
          const snapshot = await get(child(ref(db), `users/${user.uid}`));
          if (snapshot.exists()) {
            const userData = snapshot.val();
            if (userData.nama) {
              document.getElementById('penginput').value = userData.nama;
            }
          }
        } catch (e) {
          console.error(e);
        }
      }
    });

    document.getElementById('form-ayat').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await push(ref(db, 'ayat'), {
          penginput: document.getElementById('penginput').value,
          judul: document.getElementById('judul').value,
          referensi: document.getElementById('referensi').value,
          isi: document.getElementById('isi').value,
          status: 'approved', // Langsung disetujui agar tampil di halaman ayat.html
          createdAt: serverTimestamp()
        });
        alert("Ayat Alkitab berhasil disimpan!");
        window.location.href = "ayat.html";
      } catch (err) { 
        alert("Gagal: " + err.message); 
      }
    });
  </script>
</body>
</html>
