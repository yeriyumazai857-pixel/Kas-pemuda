<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Lirik Lagu - Pemuda/i BNKP Samosir</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #334155;
      padding: 20px 16px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 18px;
      color: #0f172a;
    }

    .back-btn {
      text-decoration: none;
      color: #2563eb;
      font-weight: 600;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus, .form-group textarea:focus {
      border-color: #3b82f6;
    }

    .readonly-input {
      background-color: #f1f5f9;
      color: #64748b;
      cursor: not-allowed;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🎵 Input Lirik Lagu</h1>
      <a href="dashboard.html" class="back-btn">← Dashboard</a>
    </div>

    <form id="form-lirik">
      <div class="form-group">
        <label for="penginput">Penginput</label>
        <input type="text" id="penginput" class="readonly-input" readonly placeholder="Memuat nama...">
      </div>

      <div class="form-group">
        <label for="judul">Judul Lagu</label>
        <input type="text" id="judul" placeholder="Contoh: Bapa Engkau Baik" required>
      </div>

      <div class="form-group">
        <label for="kategori">Kategori Lagu</label>
        <input type="text" id="kategori" placeholder="Contoh: Pemuda / Rohani / Penyembahan" required>
      </div>

      <div class="form-group">
        <label for="lirik">Isi Lirik Lagu</label>
        <textarea id="lirik" rows="10" placeholder="Tuliskan lirik lagu di sini..." required></textarea>
      </div>

      <button type="submit" id="btn-save" class="btn-submit">Simpan Lirik</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, get, child, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDB0E9H12BK6TaYdewtQc-gPhuFaf_HZ9c",
      databaseURL: "https://kas-pemuda-gereja-default-rtdb.firebaseio.com",
      projectId: "kas-pemuda-gereja"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUserName = "Anonim";

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
      } else {
        try {
          const snapshot = await get(child(ref(db), `users/${user.uid}`));
          if (snapshot.exists()) {
            currentUserName = snapshot.val().nama || user.email;
          } else {
            currentUserName = user.email;
          }
        } catch (e) {
          currentUserName = user.email;
        }
        document.getElementById('penginput').value = currentUserName;
      }
    });

    document.getElementById('form-lirik').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-save');
      btn.disabled = true;
      btn.textContent = "Menyimpan...";

      const judul = document.getElementById('judul').value;
      const kategori = document.getElementById('kategori').value;
      const lirik = document.getElementById('lirik').value;

      try {
        await push(ref(db, 'lirik'), {
          judul: judul,
          kategori: kategori,
          lirik: lirik,
          penginput: currentUserName,
          createdAt: serverTimestamp()
        });

        alert("Lirik lagu berhasil disimpan!");
        window.location.href = "lirik.html";
      } catch (err) {
        alert("Gagal menyimpan: " + err.message);
        btn.disabled = false;
        btn.textContent = "Simpan Lirik";
      }
    });
  </script>
</body>
</html>
